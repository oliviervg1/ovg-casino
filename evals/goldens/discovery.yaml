# Phase C — discovery Goldens
# Realistic discovery flows, testing personalization and tool calls.

common_session_parameters:
  user_first_name: "Alex"

conversations:
  - conversation: personalized_greeting
    tags: [P0, discovery, personalized]
    turns:
      - user: "Hello there!"
        agent: "Welcome to the casino, Alex! We are so excited to have you here. What kind of experience are you looking for today? Do you prefer fast-paced action or a relaxed atmosphere?"
      - user: "I'm in the mood for something with an ocean theme."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "ocean"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent — recommendation text varies"
    expectations:
      - "The agent must greet the user using their first name, Alex."
      - "The agent must ask what kind of experience they are looking for."

  - conversation: vague_discovery_fallback
    tags: [P0, discovery]
    turns:
      - user: "Hi, I just want to play something fun."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "slots"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"
    expectations:
      - "The agent must recommend a game."

  - conversation: discovery_no_results_fallback
    tags: [P0, discovery]
    turns:
      # The Query Datastore step requires a broader fallback search if the
      # first returns no results, so the agent legitimately fires two
      # search_available_games calls here. Both are listed.
      - user: "Do you have any games about Victorian era knitting?"
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "Victorian"
          - action: search_available_games
            args:
              query:
                $matchType: ignore
        agent: "# silent — fallback text should mention standard games"
    expectations:
      - "The agent must apologize and state that no exact matches were found."
      - "The agent must offer standard games like Roulette, Slots, or Bingo instead."

  - conversation: discovery_refined
    tags: [P0, discovery]
    turns:
      - user: "Show me some space games."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "space"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"
      - user: "Actually, do you have any that are more relaxed?"
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "relaxed"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"

  - conversation: display_widget_data_mapping
    tags: [P0, discovery, ui]
    turns:
      - user: "Show me popular slots."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "slots"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"
    expectations:
      - "The agent must extract the 'url' field from the search_available_games results."
      - "The agent must map the extracted 'url' to the 'uri' field in the context.games array passed to the display_game_widget tool."

  - conversation: goodbye_direct
    tags: [P0, discovery, audio_critical]
    turns:
      - user: "Thanks for the help, I'm done for today. Bye!"
        tool_calls:
          - action: end_session
            args:
              reason: "customer_query_ended"
        agent: "# silent"

  - conversation: multilingual_fr_discovery
    session_parameters:
      active_language: "fr-FR"
    tags: [P0, discovery, multilingual]
    turns:
      - user: "Salut, j'aimerais jouer à un jeu sur le thème de l'espace."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: ignore
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"

  - conversation: multilingual_es_discovery
    session_parameters:
      active_language: "es-ES"
    tags: [P0, discovery, multilingual]
    turns:
      - user: "Hola, me gustaría jugar algo del espacio."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: ignore
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent"
