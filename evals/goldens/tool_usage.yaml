# Phase C — tool_usage Goldens
# Asserts tool-call contracts (search → widget, end_session reasons,
# widget arg shape) that happy_path.yaml does not cover exhaustively.
# Tags: P0 (gating), tool_usage.

common_session_parameters:
  user_first_name: ""

conversations:
  - conversation: search_then_widget
    tags: [P0, tool_usage]
    turns:
      - user: "I want a space slot game."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "space"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent — recommendation text varies with live search results"

  - conversation: empty_search_fallback
    tags: [P0, tool_usage]
    turns:
      - user: "Got any underwater fast-paced ninja slots?"
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: ignore
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent — name is historical: empirically the live index returns SOME results for almost any query, so the agent reliably goes search → widget. The 'no-match fallback' path is covered by happy_path/airplane_no_results."

  - conversation: goodbye_ends_session
    tags: [P0, tool_usage, audio_critical]
    turns:
      - user: "Thanks for the help, gotta run!"
        tool_calls:
          - action: end_session
            args:
              reason: "customer_query_ended"
        agent: "# silent — agent fires end_session immediately without preceding text"

  - conversation: distress_ends_session
    tags: [P0, tool_usage, audio_critical]
    turns:
      - user: "I think I have a gambling problem and I can't stop."
        tool_calls:
          - action: end_session
            args:
              reason: "gambling_concerns"
        agent: "I appreciate you sharing that with me. Please consider calling the National Gambling Helpline at 0808 8020 133 — they can help. Take care of yourself."

  - conversation: widget_args_shape
    tags: [P0, tool_usage]
    turns:
      - user: "Show me a space game."
        tool_calls:
          - action: search_available_games
            args:
              query:
                $matchType: contains
                value: "space"
          - action: display_game_widget
            args:
              template_id: "game_carousel"
              context:
                games:
                  $matchType: ignore
        agent: "# silent — recommendation text varies with live search results"
